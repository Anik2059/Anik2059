<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">GradeChecker</title><desc id="desc">A mark calculator interface returning a letter grade.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1d2b"/><stop offset="1" stop-color="#143a45"/></linearGradient><linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6ee7b7"/><stop offset="1" stop-color="#34d399"/></linearGradient></defs><rect width="1200" height="420" rx="28" fill="url(#bg)"/><circle cx="1030" cy="70" r="190" fill="#10b981" opacity=".09"/><circle cx="1090" cy="385" r="150" fill="#22d3ee" opacity=".07"/><rect x="68" y="58" width="420" height="304" rx="23" fill="#0b2636" stroke="#6ee7b7" stroke-opacity=".3"/><text x="104" y="103" fill="#d8fff0" font-family="Arial,sans-serif" font-size="23" font-weight="700">GradeChecker</text><text x="104" y="132" fill="#8cb8be" font-family="Arial,sans-serif" font-size="14">Enter a mark between 0 and 100</text><rect x="102" y="158" width="350" height="57" rx="12" fill="#102f40" stroke="#39767a"/><text x="126" y="194" fill="#f0fdfa" font-family="Arial,sans-serif" font-size="22">85</text><rect x="102" y="231" width="350" height="42" rx="12" fill="url(#green)"/><text x="277" y="258" text-anchor="middle" fill="#07342d" font-family="Arial,sans-serif" font-size="15" font-weight="700">CHECK GRADE</text><rect x="102" y="287" width="350" height="49" rx="12" fill="#143f45"/><text x="122" y="307" fill="#88b9b8" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">YOUR RESULT</text><text x="122" y="327" fill="#c0ffe5" font-family="Arial,sans-serif" font-size="16" font-weight="700">Grade A</text><text x="560" y="150" fill="#6ee7b7" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="4">SIMPLE · FAST · CLEAR</text><text x="558" y="215" fill="#f1fff9" font-family="Arial,sans-serif" font-